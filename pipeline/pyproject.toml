[project]
name = "veri-korayoner"
version = "0.1.0"
description = "veri.korayoner.dev veri hattı: uluslararası kurumların Türkiye verileri, kaynağıyla"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.9",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
veri = "veri.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veri"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]   # testlerde assert

[tool.pytest.ini_options]
testpaths = ["tests"]
