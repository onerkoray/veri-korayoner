name: Yayın sonrası denetim

# Vercel main commit'ine "Vercel" statüsünü success yazdığında (Vercel bu depoda GitHub
# deployment kaydı açmıyor, yalnız commit statüsü yazıyor): canlı /api/v1 dosyaları bu commit'teki yayin/ ile
# aynı mı, katalogdaki her seri dosyası erişilebilir mi. Fark varsa issue açılır.
on:
  status: {}
  schedule:
    - cron: "50 11 * * 1-5"

permissions:
  contents: read

jobs:
  takvim:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Veri hattının son başarılı zamanlanmış koşusunu doğrula
        id: takvim
        run: |
          esik=$(python - <<'PY'
          from datetime import UTC, datetime, timedelta
          simdi = datetime.now(UTC) - timedelta(hours=28)
          gun = simdi.replace(hour=5, minute=20, second=0, microsecond=0)
          if gun > simdi:
              gun -= timedelta(days=1)
          while gun.weekday() >= 5:
              gun -= timedelta(days=1)
          print(gun.strftime('%Y-%m-%dT%H:%M:%SZ'))
          PY
          )
          son=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/veri.yml/runs?event=schedule&status=success&branch=main&per_page=1" --jq '.workflow_runs[0].created_at // empty')
          if [[ -z "$son" || "$son" < "$esik" ]]; then
            echo "eski=true" >> "$GITHUB_OUTPUT"
            echo "Son başarılı zamanlanmış koşu: ${son:-yok}; beklenen en erken zaman: $esik"
            exit 1
          fi
      - name: Zamanlama aksadıysa tek takip kaydı aç
        if: failure() && steps.takvim.outputs.eski == 'true'
        env:
          KOSU: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          baslik="Veri hattı zamanlaması aksadı"
          no=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$baslik in:title" --json number,title --jq 'map(select(.title=="Veri hattı zamanlaması aksadı")) | .[0].number // empty')
          if [ -z "$no" ]; then gh issue create --repo "$GITHUB_REPOSITORY" --title "$baslik" --body "Beklenen zamanlanmış veri koşusu başarıyla tamamlanmadı. Denetim: $KOSU"; fi

  canli:
    if: github.event.context == 'Vercel' && github.event.state == 'success' && contains(github.event.branches.*.name, 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults: { run: { working-directory: pipeline } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false, ref: "${{ github.event.sha }}" }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - name: Canlı API depodakiyle aynı mı
        id: canli
        run: uv run veri canli
        continue-on-error: true
      - name: Farklıysa takip issue'su
        if: steps.canli.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          KOSU: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.sha }}
        working-directory: .
        run: |
          baslik="Canlı API depodan farklı"
          no=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$baslik in:title" --json number --jq '.[0].number // empty')
          if [ -n "$no" ]; then gh issue comment "$no" --repo "$GITHUB_REPOSITORY" --body "Yine ($SHA): $KOSU"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$baslik" --body "Yayın $SHA sonrası canlı dosyalar depodakiyle uyuşmuyor. Koşu: $KOSU"; fi
      - name: Sonuç
        if: steps.canli.outcome == 'failure'
        run: exit 1
