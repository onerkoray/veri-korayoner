  # ---- OECD (SDMX; kod = ajans,akış,sürüm/anahtar) --------------------------
  - id: oecd-oncu-gosterge-tr
    kaynak: oecd
    kod: OECD.SDD.STES,DSD_STES@DF_CLI,/TUR.M.LI...AA...H
    ulke: TUR
    baslik: Bileşik öncü gösterge (CLI), genlik ayarlı
    tema: buyume
    siklik: aylik
    birim: endeks
    carpan: 1
    not: Uzun dönem ortalaması = 100. 100'ün üstü ekonomik faaliyetin eğilimin üzerinde seyredeceğine işaret eder; tahmin değil öncü sinyaldir.

  # ---- ECB (SDMX; kod = akış/anahtar; kurda ülke yerine para birimi) ----------------
  - id: ecb-eur-try-gunluk
    kaynak: ecb
    kod: EXR/D.TRY.EUR.SP00.A
    ulke: TUR
    baslik: Euro referans kuru, 1 euro kaç TL
    tema: doviz-rezerv
    siklik: gunluk
    birim: TRY/EUR
    carpan: 1
    baslangic: "2005-01-01"
    not: ECB'nin her iş günü 14.15 CET tespitiyle yayımladığı referans kuru; işlem kuru değildir. 2005 öncesi eski TL milyonda bire bölünmüş olduğundan seri 2005'ten başlatılır.

  # ---- Eurostat (SDMX 2.1; kod = veri seti/anahtar; emsal yalnız AB) -----------------
  - id: eurostat-hicp-yillik-tr
    kaynak: eurostat
    kod: prc_hicp_minr/M.RCH_A.TOTAL.TR
    ulke: TUR
    baslik: Uyumlaştırılmış tüketici fiyatları (HICP), yıllık değişim
    tema: enflasyon
    siklik: aylik
    birim: yuzde
    carpan: 1
    emsal: [EUU, POL, HUN, ROU]
    not: AB ülkeleriyle aynı yöntemle derlenen enflasyon ölçüsü; TÜFE ile aynı değildir. Eurostat 2026'da COICOP 2018 sınıflamasına geçti (prc_hicp_minr).

  - id: eurostat-issizlik-aylik-tr
    kaynak: eurostat
    kod: une_rt_m/M.SA.TOTAL.PC_ACT.T.TR
    ulke: TUR
    baslik: İşsizlik oranı, aylık, mevsimsellikten arındırılmış
    tema: isgucu
    siklik: aylik
    birim: yuzde
    carpan: 1
    emsal: [EUU, POL, HUN, ROU]
    not: 15-74 yaş, işgücüne oran. AB ülkeleriyle karşılaştırılabilir tanım.
