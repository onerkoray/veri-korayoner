# Seri kaydı — her satır bir kaynağın bir Türkiye serisi.
#
# Seri kodu ancak kaynağın kendi metaverisinden doğrulandıktan sonra yazılır
# (pipeline `--dogrula` metaveriyi çeker ve ad/birim uyuşmazlığında durur).
# `yayin` alanı kaynağın iznini yalnız DARALTABİLİR, genişletemez.

seriler:
  - id: wb-ny-gdp-mktp-cd-tur
    kaynak: world_bank
    kod: NY.GDP.MKTP.CD
    ulke: TUR
    baslik: Gayrisafi yurt içi hasıla, cari ABD doları
    tema: buyume
    siklik: yillik
    birim: USD
    baglam: "Ekonominin bir yılda ürettiği nihai mal ve hizmetlerin piyasa değeri, cari dolarla. Dolar cinsinden olduğu için kur hareketleri değeri büyütüp küçültebilir; reel büyüme için sabit fiyatlı büyüme oranına bakılır."
    iliskili: [wb-ny-gdp-mktp-kd-zg-tur, wb-ny-gdp-pcap-cd-tur, wb-sp-pop-totl-tur]
    carpan: 1

  - id: wb-ny-gdp-pcap-cd-tur
    kaynak: world_bank
    kod: NY.GDP.PCAP.CD
    ulke: TUR
    baslik: Kişi başına GSYH, cari ABD doları
    tema: buyume
    siklik: yillik
    birim: USD
    baglam: "GSYH'nin nüfusa bölümü, cari dolarla. Ülkeler arası refah karşılaştırmasında fiyat düzeyi farkı için satın alma gücü paritesiyle hesaplanan seri daha uygundur."
    iliskili: [wb-ny-gdp-pcap-pp-kd-tur, wb-sp-pop-totl-tur, wb-ny-gdp-mktp-cd-tur]
    carpan: 1
    emsal: [BRA, MEX, ZAF, POL, HUN, IND, IDN, CHL, COL]

  - id: wb-ny-gdp-mktp-kd-zg-tur
    kaynak: world_bank
    kod: NY.GDP.MKTP.KD.ZG
    ulke: TUR
    baslik: GSYH büyümesi, yıllık, sabit fiyatlarla
    tema: buyume
    siklik: yillik
    birim: yuzde
    baglam: "Sabit fiyatlarla GSYH'nin bir önceki yıla göre değişimi: fiyat etkisi ayıklanmış üretim artışı. Yıl içindeki seyir için çeyreklik büyüme serisi, gelecek için öncü göstergeler birlikte okunur."
    iliskili: [oecd-gsyh-buyume-yillik-tr, oecd-oncu-gosterge-tr, wb-ne-gdi-ftot-zs-tur]
    carpan: 1
    emsal: [BRA, MEX, ZAF, POL, HUN, IND, IDN, CHL, COL]

  - id: wb-fp-cpi-totl-zg-tur
    kaynak: world_bank
    kod: FP.CPI.TOTL.ZG
    ulke: TUR
    baslik: Enflasyon, tüketici fiyatları, yıllık
    tema: enflasyon
    siklik: yillik
    birim: yuzde
    baglam: "Tüketici fiyat endeksinin yıllık ortalama değişimi. Aylık seyir için BIS'in aylık yıllık TÜFE serisi, yurt içi üretimin fiyatı için GSYH deflatörü birlikte okunur."
    iliskili: [bis-tufe-yillik-tr, wb-ny-gdp-defl-kd-zg-tur, bis-politika-faizi-tr]
    carpan: 1
    emsal: [BRA, MEX, ZAF, POL, HUN, IND, IDN, CHL, COL]

  - id: wb-bn-cab-xoka-gd-zs-tur
    kaynak: world_bank
    kod: BN.CAB.XOKA.GD.ZS
    ulke: TUR
    baslik: Cari işlemler dengesi, GSYH'ye oran
    tema: dis-sektor
    siklik: yillik
    birim: yuzde-gsyh
    baglam: "Mal, hizmet, gelir ve transfer akımlarının dengesi. Muhasebe özdeşliği gereği yurt içi tasarruf ile yatırım arasındaki farka eşittir; açık, dış finansman ihtiyacı demektir."
    iliskili: [wb-ny-gds-totl-zs-tur, wb-ne-gdi-ftot-zs-tur, wb-dt-dod-dect-gn-zs-tur]
    carpan: 1
    emsal: [BRA, MEX, ZAF, POL, HUN, IND, IDN, CHL, COL]

  - id: wb-dt-dod-dect-cd-tur
    kaynak: world_bank
    kod: DT.DOD.DECT.CD
    ulke: TUR
    baslik: Toplam dış borç stoku, cari ABD doları
    tema: dis-sektor
    siklik: yillik
    birim: USD
    baglam: "Yurt dışına olan kamu ve özel borcun toplamı, cari dolarla. Ölçek için gelire oranı, geri ödeme kapasitesi için rezervler birlikte okunur."
    iliskili: [wb-dt-dod-dect-gn-zs-tur, wb-fi-res-totl-cd-tur, wb-bn-cab-xoka-gd-zs-tur]
    carpan: 1
    not: Uluslararası Borç İstatistikleri (IDS) kaynaklı; metaveri kaynak notu okunur.

  - id: wb-sl-uem-totl-zs-tur
    kaynak: world_bank
    kod: SL.UEM.TOTL.ZS
    ulke: TUR
    baslik: İşsizlik oranı, işgücüne oran (ILO modeli)
    tema: isgucu
    siklik: yillik
    birim: yuzde
    deger_turu: model_tahmini   # kaynak beyanı: ILO modelled estimates
    baglam: "Dünya Bankası'nın ILO modelli işsizlik tahmini; ülkeler arası karşılaştırma için uyumlaştırılmıştır. Ulusal işgücü anketine dayanan ILO serisi ve aylık Eurostat serisi birlikte okunur."
    iliskili: [ilo-issizlik-tr, eurostat-issizlik-aylik-tr, ilo-isgucune-katilim-tr]
    carpan: 1
    emsal: [BRA, MEX, ZAF, POL, HUN, IND, IDN, CHL, COL]
    not: ILO model tahmini (ILO modelled estimates); kaynak ILO, CC BY 4.0. Ulusal işgücü anketine dayalı oran için ILO serisine bakın.

  - id: wb-fi-res-totl-cd-tur
    kaynak: world_bank
    kod: FI.RES.TOTL.CD
    ulke: TUR
    baslik: Toplam rezervler (altın dahil), cari ABD doları
    tema: doviz-rezerv
    siklik: yillik
    birim: USD
    baglam: "Merkez bankasının dış varlıkları (altın dahil), brüt, cari dolarla. Yeterliliği ithalatı kaç ay karşıladığıyla ve dış borçla birlikte okunur."
    iliskili: [wb-fi-res-totl-mo-tur, wb-dt-dod-dect-cd-tur, wb-ne-imp-gnfs-zs-tur]
    carpan: 1
    not: IMF IFS kaynaklı; kaynak notu okunur.

