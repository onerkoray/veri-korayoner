# Kaynak kaydı — veri.korayoner.dev
#
# Lisans kapısı burada: yayin.gosterim / yayin.indirme / yayin.api üçü de
# ayrı. Bir kaynağın izni ancak resmî kullanım şartı okunup `kanit` adresi ve
# `inceleme_tarihi` yazıldıktan sonra true olur. Boş ya da false olan seri
# sayfaya, CSV'ye ve API'ye girmez (pipeline/veri/yayin.py + CI).
#
# durum:
#   aktif            bağlayıcı yazıldı, örnek çekme doğrulandı, lisans onaylı
#   gelistiriliyor   bağlayıcı yazılıyor
#   planlandi        sırada; ne bağlayıcı ne lisans incelemesi var
#   anahtar-gerekli  API anahtarı ister (gizli değişken yok)
#   lisans-gerekli   ticari sözleşme olmadan yayımlanamaz
#   yalniz-katalog   resmî ve kararlı erişim yok (scraping yapılmaz)
#
# Başlangıç listesi kullanıcının SOURCE_REGISTRY.csv'sinden süzüldü
# (17 Kasım 2026). Ticari terminal ve aracı fiyat servisleri (Bloomberg,
# LSEG, FactSet, MSCI, Trading Economics, Yahoo vb.) bu sürümde kayda
# alınmadı: hiçbiri sözleşmesiz kamuya yeniden yayına izin vermiyor ve
# kayıtta durmaları okura veri değil boş satır gösterir. Liste
# docs/kaynak-evreni.md'de.

kaynaklar:
  - id: world_bank
    ad: Dünya Bankası — Dünya Kalkınma Göstergeleri (WDI)
    kurum: Dünya Bankası
    adres: https://data.worldbank.org/
    api: https://api.worldbank.org/v2/
    belge: https://datahelpdesk.worldbank.org/knowledgebase/articles/889392
    erisim: REST JSON
    anahtar: false
    durum: aktif
    lisans:
      ad: CC BY 4.0 (WDI veri seti)
      kanit: https://datacatalog.worldbank.org/search/dataset/0037712/World-Development-Indicators
      inceleme_tarihi: 2026-11-17
      atif_zorunlu: true
      not: >-
        WDI veri setinin katalog kaydı lisansı "Creative Commons Attribution
        4.0" olarak veriyor (setin bütünü). Dünya Bankası kullanım şartları
        üçüncü taraf içerik sağlayıcılarına da atıf istiyor: her seri sayfası
        ve dosyası asıl kaynağı (metaveri `sourceOrganization`) taşır ve atıf
        metnine ekler. Genel lisans sayfası:
        https://datacatalog.worldbank.org/public-licenses
    yayin: { gosterim: true, indirme: true, api: true }

  - id: bis
    ad: BIS Veri Portalı
    kurum: Uluslararası Ödemeler Bankası (BIS)
    adres: https://data.bis.org/
    api: https://stats.bis.org/api/v2/
    belge: https://stats.bis.org/api-doc/v2/
    erisim: SDMX REST
    anahtar: false
    durum: aktif
    lisans:
      ad: BIS istatistik kullanım şartları
      kanit: https://data.bis.org/help/legal
      inceleme_tarihi: 2026-11-17
      atif_zorunlu: true
      kosullar:
        - "Kaynak: BIS (Uluslararası Ödemeler Bankası)."
        - "Seri adları Türkçeye çevrilmiştir; çeviri resmî BIS çevirisi değildir."
        - "Bu site BIS ile bağlantılı değildir; BIS'in onayını taşımaz."
        - "BIS verinin doğruluğunu garanti etmez; veri yatırım tavsiyesi değildir."
      not: >-
        Şart: istatistiğin kullanımı serbest; kaynak BIS gösterilir, çeviri
        resmî değildir notu, onay ima edilmez, ticari üründe ek ücret
        alınmaz. API şartı en güncel API sürümünü (v2) ister. Politika
        faizi ve konut fiyatlarında ulusal kaynak da gösterilir (seri
        dosyasındaki asıl kaynak). Gözlem düzeyinde OBS_CONF=F (free)
        olmayan değer yayımlanmaz.
    yayin: { gosterim: true, indirme: true, api: true }

  - id: imf
    ad: IMF Veri
    kurum: Uluslararası Para Fonu (IMF)
    adres: https://data.imf.org/
    api: null
    belge: https://data.imf.org/en/Resource-Pages/IMF-API
    erisim: SDMX
    anahtar: null
    durum: planlandi
    lisans:
      ad: IMF Special Terms for Statistical Data
      kanit: https://www.imf.org/en/About/copyright-and-terms
      inceleme_tarihi: 2026-11-17
      atif_zorunlu: true
      not: >-
        İncelendi, AÇILMADI. Veri şartı yeniden yayına izin veriyor (atıf,
        değiştirmeme, platform kullanıcılarına şartları iletme). Ancak (1)
        "potential commercial reuse" için copyright@imf.org'dan izin
        isteniyor; açık API'mizi ticari kullanıcılar da okuyabilir. (2)
        Genel şartlar, açık izin olmadan otomatik araçla toplu indirmeyi
        yasaklıyor. Açmak için IMF'den yazılı izin (e-posta) gerekir;
        alınana kadar seri yok. WDI içindeki IMF kaynaklı seriler WDI'nın
        CC BY 4.0 lisansıyla yayımlanıyor.
    yayin: { gosterim: false, indirme: false, api: false }

  - id: oecd
    ad: OECD Data Explorer
    kurum: OECD
    adres: https://data-explorer.oecd.org/
    api: https://sdmx.oecd.org/public/rest/
    belge: null
    erisim: SDMX REST
    anahtar: false
    durum: aktif
    lisans:
      ad: OECD Terms and Conditions (veri)
      kanit: https://www.oecd.org/en/about/terms-conditions.html
      inceleme_tarihi: 2026-11-17
      atif_zorunlu: true
      kosullar:
        - "Kaynak: OECD; veri setinin önerdiği atıf biçimiyle."
        - "Seri adları Türkçeye çevrilmiştir."
      not: >-
        Şart: OECD verisi ticari kullanım dahil her amaçla çıkarılabilir,
        indirilebilir, uyarlanabilir ve paylaşılabilir; OECD'ye atıf yapılır
        ve atıf şartı alt kullanıcılara aktarılır. Belirli veri setlerinde
        üçüncü taraf hakları ek kısıt getirebilir. ÖNEMLİ: şart sayfası
        otomatik istemcilere 403 dönüyor; metin 17 Kasım 2026'da arama
        dizinindeki kopyadan okundu. Tarayıcıdan elle teyit bekleniyor.
        Bkz. OECD açık erişim duyurusu (Temmuz 2024):
        https://www.oecd.org/en/about/news/press-releases/2024/07/oecd-data-publications-and-analysis-become-freely-accessible.html
    yayin: { gosterim: true, indirme: true, api: true }

  - id: eurostat
    ad: Eurostat
    kurum: Avrupa Birliği İstatistik Ofisi (Eurostat)
    adres: https://ec.europa.eu/eurostat
    api: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/
    belge: https://ec.europa.eu/eurostat/en/web/user-guides/data-browser/api-data-access/api-introduction
    erisim: SDMX 2.1 REST
    anahtar: false
    durum: aktif
    lisans:
      ad: CC BY 4.0 (Komisyon Kararı 2011/833/AB)
      kanit: https://ec.europa.eu/eurostat/help/copyright-notice
      inceleme_tarihi: 2026-11-17
      atif_zorunlu: true
      kosullar:
        - "Kaynak: Eurostat."
        - "Seri adları Türkçeye çevrilmiştir; değerler değiştirilmemiştir."
        - "Eurostat bu sitenin kullanımından sorumlu değildir."
      not: >-
        Şart: istatistik ve metaveri ticari ya da ticari olmayan amaçla, kaynak
        gösterilerek yeniden kullanılabilir; değişiklik yapılırsa belirtilir.
        İstisna: AB, EFTA ve resmî aday ülkeler dışındaki ülkelerin verisi
        ticari kullanılamaz. Türkiye aday ülkedir; emsal kümesi yalnız AB
        üyeleri ve AB toplamıdır (bağlayıcıda SART_KAPSAMI ile zorlanır).
    yayin: { gosterim: true, indirme: true, api: true }

  - id: ecb
    ad: ECB Veri Portalı
    kurum: Avrupa Merkez Bankası (ECB)
    adres: https://data.ecb.europa.eu/
    api: https://data-api.ecb.europa.eu/service/
    belge: https://data.ecb.europa.eu/help/api/overview
    erisim: SDMX REST
    anahtar: false
    durum: aktif
    lisans:
      ad: ESCB istatistik kullanım politikası (ücretsiz yeniden kullanım)
      kanit: https://www.ecb.europa.eu/stats/ecb_statistics/governance_and_quality_framework/html/usage_policy.en.html
      inceleme_tarihi: 2026-11-17
      atif_zorunlu: true
      kosullar:
        - "Source: ECB statistics."
        - "İstatistik ve metaverisi değiştirilmeden yayımlanır."
        - "ECB serilerin sürekliliğini garanti etmez; seriler revize edilebilir."
      not: >-
        Şart: kamuya açık istatistik, ticari ya da ticari olmayan kullanımdan
        bağımsız olarak ücretsiz yeniden kullanılabilir; kaynak gösterilir,
        istatistik değiştirilmez. Üçüncü taraf verisi kapsam dışıdır; referans
        kurları ECB'nin kendi yayımıdır.
    yayin: { gosterim: true, indirme: true, api: true }

  - id: tcmb_evds
    ad: TCMB EVDS 3
    kurum: Türkiye Cumhuriyet Merkez Bankası
    adres: https://evds3.tcmb.gov.tr/
    api: null
    belge: https://evds3.tcmb.gov.tr/hakkinda
    erisim: REST JSON/CSV/XML
    anahtar: null
    durum: planlandi
    lisans:
      ad: EVDS kullanım şartları
      kanit: null
      inceleme_tarihi: null
      atif_zorunlu: true
      not: >-
        Kullanıcı notu: şartlar kaynak gösterilerek yayına ve ücret
        alınmamasına bağlı. Şart metni okunup kanıt adresi yazılmadan
        yayın izni açılmaz.
    yayin: { gosterim: false, indirme: false, api: false }

  - id: un_comtrade
    ad: UN Comtrade
    kurum: Birleşmiş Milletler
    adres: https://comtradeplus.un.org/
    api: null
    belge: https://comtradeplus.un.org/en/api-docs
    erisim: REST
    anahtar: true
    durum: anahtar-gerekli
    lisans: { ad: null, kanit: null, inceleme_tarihi: null, atif_zorunlu: true,
              not: "Anahtarsız önizleme 500 satırla sınırlı; tam veri kayıt ve plan ister." }
    yayin: { gosterim: false, indirme: false, api: false }

  - id: fred
    ad: FRED
    kurum: St. Louis Fed
    adres: https://fred.stlouisfed.org/
    api: null
    belge: https://fred.stlouisfed.org/docs/api/fred/
    erisim: REST
    anahtar: true
    durum: anahtar-gerekli
    lisans: { ad: null, kanit: null, inceleme_tarihi: null, atif_zorunlu: true,
              not: "Üçüncü taraf kaynaklı serilerde yeniden yayın kısıtı olabilir; seri bazında incelenir." }
    yayin: { gosterim: false, indirme: false, api: false }

  - id: bist
    ad: Borsa İstanbul
    kurum: Borsa İstanbul
    adres: https://www.borsaistanbul.com/
    api: null
    belge: https://www.borsaistanbul.com/sss/veri-dagitim-ve-endeks-lisanslama
    erisim: Lisanslı dağıtım
    anahtar: true
    durum: lisans-gerekli
    lisans: { ad: null, kanit: null, inceleme_tarihi: null, atif_zorunlu: true,
              not: "Lisanslı dağıtıcı modeli; dağıtım izni olmadan aynalanmaz." }
    yayin: { gosterim: false, indirme: false, api: false }
